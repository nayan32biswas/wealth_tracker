name: wealthtracker
description: "Personal wealth tracker"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.7
  csv: ^8.0.0
  drift: ^2.35.0
  file_picker: ^13.1.0
  fl_chart: ^1.2.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  intl: ^0.20.3
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  sqlite3: ^3.6.0
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App icon. Sources are in assets/icon/ (SVG, rendered to PNG at 1024 px).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#EEF4F3"
  adaptive_icon_foreground: assets/icon/foreground.png
  adaptive_icon_monochrome: assets/icon/monochrome.png
